services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduverify_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./eduverify.db
      - SECRET_KEY=eduverify-ai-secret-key-sih-26263-production-safe-32b
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eduverify_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
